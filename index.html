<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header header--index">
        <div class="container header__container">
            <a class="header__logo-wrapper" href="#">
                <img class="header__logo-img" src="img/favicon.png" alt="logo">
            </a>

            <nav class="header__nav"></nav>
            <ul class="header__nav-list">
                <li class="header__nav__item">
                    <a class="header__nav-link" href="#">Favorite coffee</a>
                </li>
                <li class="header__nav__item">
                    <a class="header__nav-link" href="#">About</a>
                </li>
                <li class="header__nav__item">
                    <a class="header__nav-link" href="#">Mobile app</a>
                </li>
                <li class="header__nav__item">
                    <a class="header__nav-link" href="#">Contact us</a>
                </li>
            </ul>
            <div class="header__menu-n-color">
                <div class="header__theme-switch">
                    <img class="header__sun-toogle" src="icons/sun.svg" alt="sun-theme">
                    <img class="header__sun-toogle" src="icons/moon.svg" alt="dark-theme">
                </div>
                <a class="header__menu-btn">Menu</a>
            </div>

        </div>
    </header>

    <main class="main main--index">
        <section id="#" class="___">
            <div class="container about__container">
            </div>
        </section>

    </main>
    <footer id="contacts" class="footer">
        <div class="container footer__container">
        </div>
    </footer>

</body>

</html>
